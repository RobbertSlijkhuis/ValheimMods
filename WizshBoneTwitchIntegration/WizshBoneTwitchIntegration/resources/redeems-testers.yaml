    creatures:
      - prefabName: FeoTheHistorian_WBTI
        position: InFrontOfPlayer
        rename: false
        talkInteract: true
        talkMessage: "Napoleon was not particularly short � he was about 1.69 m tall, which was average for his time. The fact that he was called short was just war propaganda.;
          The shortest war in history was between Great Britain and Zanzibar in 1896 � it lasted 38 minutes.;
          Cleopatra lived closer in time to the invention of the iPhone than to the construction of the Great Pyramid of Giza.;
          The last execution by guillotine in France took place in 1977 � the same year Star Wars premiered.;
          The Romans used urine to whiten their teeth.;
          U.S. President Grover Cleveland served two non-consecutive terms � he is both the 22nd and 24th president.;
          The Aztecs believed chocolate was a gift from the gods and used cacao beans as currency.;
          In ancient Rome, left-handedness was considered bad luck � as in many cultures.;
          The Great Wall of China is not a single wall, but several walls built during different periods.;
          Titanic�s distress signal SOS was not widely used until after the 1912 disaster � CQD was still in use at the time.;
          Sweden was in a union with Norway until 1905.;
          Queen Christina abdicated, converted to Catholicism, and moved to Rome.;
          Sweden had a female monarch in the 18th century: Ulrika Eleonora, though she was a weak ruler.;
          The Stockholm Bloodbath of 1520 was a Danish mass execution of Swedish noblemen � it led to Gustav Vasa�s rebellion.;
          During the Age of Great Power, Sweden had colonies, including Saint Barth�lemy in the Caribbean.;
          The Falun Copper Mine was called �Sweden�s treasure chest� � it supplied large parts of Europe�s copper production.;
          The House of Vasa died out in the male line in 1660.;
          Charles XII died in Halden, Norway � it is still unclear whether he was shot by the enemy or by someone in his own camp.;
          During World War II, Sweden was officially neutral but exported iron ore to Nazi Germany.;
          Sweden introduced universal suffrage for women in 1921.;
          The modern toothbrush was invented in China in the 15th century.;
          Leonardo da Vinci often wrote in mirror script � it is believed he did this to prevent others from stealing his ideas.;
          Vikings did not have horns on their helmets � this is a myth from 19th-century opera and art.;
          The Eiffel Tower could have ended up in Barcelona, but the city declined.;
          Hitler did not become a German citizen until 1932.;
          The American Declaration of Independence was printed on hemp paper.;
          The Mongol invasions killed so many people that they lowered the Earth�s carbon dioxide levels.;
          During the Middle Ages, tomatoes were believed to be poisonous in Europe.;
          Pope Gregory IX believed cats were demonic, leading to mass killings of cats � likely contributing to the spread of the plague.;
          In ancient Greece, some politicians were chosen by lottery.;
          In September 1916, a circus elephant named Mary was sentenced to hanging after killing a circus worker.;
          Cleopatra lived closer to the invention of the iPhone than to the building of the pyramids.;
          Oxford University was founded before the Aztec Empire (Oxford c. 1096, Aztecs c. 1325).;
          Napoleon was not particularly short � he was about 1.69 m tall, which was average for French men in the 19th century.;
          The Romans used concrete so durable that their harbors still stand after 2,000 years; modern scientists are trying to replicate the recipe.;
          Vikings sometimes used walrus tusks as �fake ivory� for trade with Europe.;
          Tsar Peter the Great introduced a beard tax in Russia in 1698 � if you wanted a beard, you had to pay.;
          The Great Wall of China is not visible from the Moon with the naked eye � a persistent myth.;
          Benjamin Franklin wanted the turkey to be the national bird of the United States instead of the bald eagle.;
          World War II technically ended in 1990 between Germany and the Soviet Union when a formal peace agreement was signed.;
          Roman gladiators mostly ate a vegetarian diet rich in barley and beans.;
          The Eiffel Tower was heavily criticized when it was built � many called it an �iron monster.� 
          Shakespeare�s plays contain over 20,000 different words, an exceptionally rich vocabulary for his time.;
          Egyptian pharaohs sometimes buried servants alive in their tombs so they could �accompany them into the afterlife.� 
          Leonardo da Vinci could write with one hand and draw with the other � at the same time.;
          Charlemagne is said to have been illiterate despite ruling an empire and promoting education.;
          The Great Fire of London in 1666 destroyed 80% of the city � yet only six deaths were officially recorded.;
          Japan still had samurai in the 19th century � they were officially abolished in 1876.;
          Chinese gunpowder was first used in fireworks long before it became military technology.;
          The Mona Lisa was stolen in 1911 and missing for two years � it was only then that it became truly famous worldwide.;
          The Spanish Inquisition actually killed fewer people than many believe � but its terror and torture methods made it legendary.;
          Stonehenge was built several thousand years before the pyramids of Egypt.;
          Hitler was rejected twice when he applied to art school in Vienna.;
          Titanic had a sister ship, Britannic, which also sank � during World War I.;
          President Andrew Jackson survived an assassination attempt when both of the attacker�s pistols misfired; Jackson then beat the attacker with his cane.;
          Spartan mothers reportedly told their sons when they went to war: �Come back with your shield � or on it.� 
          Alexander the Great founded more than 20 cities named after himself, the most famous being Alexandria in Egypt.;
          France executed people by guillotine long after humans had begun traveling into space � the last time was in 1977.;
          Vikings drank mead made from fermented honey, often mixed with herbs to �become stronger in battle.�.; 
          Sweden�s first printed book was Dialogus creaturarum (1483) � a collection of fables."
