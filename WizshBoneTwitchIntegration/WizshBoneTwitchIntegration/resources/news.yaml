# Shown in the News dialog (automatically on the first open after "version" goes up, or any time
# via the sidebar's News button). Bump "version" only when a release has something to say.
# Avoid angle brackets in the text - the dialog's Text components have rich text enabled.
# Bodies use ">-" (folded): the line breaks in this file are NOT shown in-game, the dialog wraps
# the text itself. A blank line starts a new paragraph. Use "|-" instead where line breaks matter
# (e.g. the list below).
version: 2
title: 1.0.2 The MONSTER update!
sections:
  - heading: General
    body: |-
      Thank you for using WizshBone Twitch Integration! This is the Monster update, figuratively and literally! So many changes and most affect the monsters! Here are the highlights of this update. The full list is in the changelog.

      - Logging in is now a single authorization.
      - Session-expiry warnings and an automatic logout that also removes your redeems from Twitch.
      - Leaderboards: tracks your viewers, their points, redeem count, favorite redeems and deaths caused.
      - Built-in profiles: "Normal" and "Chatting only" always exist and can't be deleted, renamed or synced. Use Reset to restore their original redeems and settings.
      - New profiles can start empty or be based on another profile.
      - You can rebind the key that opens the main window on the Home tab.
      - Number settings are now limited to valid values, plus many UX improvements.
      - You can now change the position of the status HUD in the settings.
  - heading: Monsters and redeems
    body: |-
      - Recolors now have a second (emission) color for the glowing parts.
      - Many more creatures, and all bosses up to The Queen, can be recolored.
      - Resized creatures now scale their attacks, hitbox, gear and death effects.
      - Many new creature form fields, like equipment. Some are experimental, so please report anything odd!
      - Rockies can now be claimed with "claim:", can talk and can be recolored!
      - Weather redeem: cycle weathers, follow the player, frost resistance, multiplayer sync.
      - Surprise chest: "Stack size" is now "Amount", and quality can go above the normal maximum.
      - Flashbang now flashes nearby players too.
      - Resized players are now visible to other players in multiplayer.
      - Safezones: spawned monsters' projectiles and hits can no longer reach players inside a zone.
      - The safezone ward can now be hidden from the build menu.
  - heading: Known issues
    body: |-
      The mod is still young, so there are a few rough edges that I'm working on. If something behaves strangely, the Help tab has tools for some problems. Please reach out to me on Discord if you run into major issues (use the Join Discord button below).

      - Creature recoloring is not finished yet: not every creature can be recolored so far.
      - Multiplayer has not been thoroughly tested yet, so some issues can arise. Please let me know if you run into any.
  - heading: Future plans
    body: |-
      These are my plans to improve the mod. There is still a lot more to come:

      - More default profiles with different levels of chaos and difficulty!
      - More redeem types, like dropping your inventory, inverted movement, exploding chickens and much more!
      - A periodic vote that lets viewers decide your fate with a random redeem
      - Surprise chests that can be a mimic, spawn other redeems and taunt you!
      - A new cooldown system with shared cooldowns
      - More commands for viewers to control the creatures they claimed or spawned


      And much more! If you have any ideas or suggestions, please reach out to me on Discord (use the Join Discord button below).
