  # TimeStop
  #######################
  - title: Timestop
    description: Stops time for the streamer and monsters in the area.
    points: 300
    backgroundColor: '#D3FFA9'
    cooldown: 600
    ignoreWard: true
    type: TimeStop
    timeStopData:
      duration: 10
      freezePlayer: true
      announceMessage: '{{user}} has stopped time for you!'
  #######################
  # Trap
  #######################
  - title: 'Spawn: Trap Field!'
    description: Spawn traps around the streamer!
    points: 300
    backgroundColor: '#1a3813'
    cooldown: 300
    type: Trap
    spawnAbilityData:
      allowDrops: false
      announceMessage: Minor inconveniences deployed by {{user}}!
      breakOnDestroy: true
      damage:
        blunt: 50
        pierce: 50
        basedOnMaxHealthAndArmor: true
        maxHealthPercentage: 0.35
      duration: 300
      groundOffset: 0
      maxToSpawn: 300
      minToSpawn: 300
      snapToterrain: true
      spawnDelay: 0.0001
      spawnRadius: 25
      spawns:
      - fuling_trap
  #######################
  # Weather
  #######################
  - title: Weather Random
    description: Spawn random weather in the area the Streamer is in right now!
    points: 120
    backgroundColor: '#70FFEA'
    ignoreWard: true
    type: Weather
    weatherData:
      announceMessage: '{{user}} is changing the skybox!'
      duration: 300
      height: 100
      radius: 300
      items:
      - Clear
      - LightRain
      - Rain
      - Misty
      - ThunderStorm
      - nofogts
      - SwampRain
      - Mistlands_clear
      - Mistlands_rain
      - Mistlands_thunder
      - Heath clear
      - Eikthyr
      - GDKing
      - Bonemass
      - GoblinKing
      - Queen
      - Fader
      - Ghosts
      - Caves
      - Ashlands_storm
      - Ashlands_SeaStorm
      - Ashlands_misty
      - Ashlands_meteorshower
      - Ashlands_CinderRain
      - Ashlands_ashrain_clear
      - Ashlands_ashrain
      - Crypt
      - Darklands_dark
      - DeepForest Mist
      - Eikthyr_no_lightning
      - InfectedMine
      - Morkhalla
      - SunkenCrypt
      - TheHollow
  #######################
  # Windmill
  #######################
  - title: 'Spawn: Windmills of DEATH'
    description: Spawn posessed windmills around the streamer!
    points: 300
    backgroundColor: '#5E4F35'
    cooldown: 300
    type: Windmill
    spawnAbilityData:
      allowDrops: false
      announceMessage: The bane of Shuki_NL... spawned by {{user}}!
      breakOnDestroy: true
      damage:
        blunt: 100
        basedOnMaxHealthAndArmor: true
        maxHealthPercentage: 0.15
      duration: 60
      windmillRotationSpeed: 10
      groundOffset: -3
      maxToSpawn: 100
      minToSpawn: 100
      snapToterrain: true
      spawnDelay: 0.001
      spawnRadius: 30
      spawns:
      - Windmill_WBTI
