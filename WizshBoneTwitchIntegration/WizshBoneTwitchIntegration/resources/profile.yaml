  #######################
  # BoatRain
  #######################
  - title: 'Spawn: BOATPOCALYPSE'
    description: Rain down Karves around the streamer!
    points: 300
    backgroundColor: '#c7915b'
    cooldown: 300
    type: BoatRain
    spawnAbilityData:
      accuracy: 1
      allowDrops: false
      announceMessage: 'Current weather forecast: 100% chance of BOATPOCALYPSE (sponsored by {{user}})'
      damage:
        blunt: 50
        basedOnMaxHealthAndArmor: true
        maxHealthPercentage: 0.4
      duration: 60
      groundOffset: 50
      maxToSpawn: 50
      minToSpawn: 50
      spawnRadius: 15
      spawns:
      - Karve
  #######################
  # Detonate
  #######################
  - title: Detonate Fizsh!
    description: Detonate fish around the streamer!
    points: 300
    backgroundColor: '#FF0000'
    cooldown: 300
    ignoreWard: true
    type: Detonate
    detonateData:
      announceMessage: '{{user}} made things a bit more explosive!'
      radius: 40
      damageData:
        blunt: 70
        chop: 160
        fire: 30
        pickaxe: 160
        basedOnMaxHealthAndArmor: true
      damageTerrain: false
