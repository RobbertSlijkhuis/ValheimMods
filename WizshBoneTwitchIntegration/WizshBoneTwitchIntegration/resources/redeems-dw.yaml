redeems:
  #######################
  # Detonate
  #######################
  - title: 'WBTI Detonate: Fizsh!'
    description: Detonate fish around the streamer!
    points: 300
    backgroundColor: '#ff6f00'
    type: Detonate
    detonateData:
      radius: 30
      damageData:
        blunt: 70
        fire: 30
        basedOnMaxHealthAndArmor: true
  - title: 'WBTI: NUKE!'
    points: 1000000
    backgroundColor: '#ff6f00'
    globalKeyAdd: defeated_fader
    type: Detonate
    detonateData:
      radius: 100
      type: CreatureSpawned
      damageData:
        blunt: 70
        fire: 30
        basedOnMaxHealthAndArmor: true
  #######################
  # Flashbang
  #######################
  - title: WBTI Flashbang!
    description: Flash bang the streamer so he cannot see anything for a moment, not even his UI!
    points: 265
    backgroundColor: '#ffffff'
    cooldown: 180
    type: Flashbang
  #######################
  # Mist
  #######################
  - title: WBTI Mist
    description: Spawn in Mistlands mist to cover the vision of the streamer... and for some creatures!
    points: 300
    backgroundColor: '#8f6bd6'
    cooldown: 180
    type: Mist
    mistData:
      announceMessage: '{{user}} made things slightly harder to see!'
      duration: 90
      radius: 65
  #######################
  # SpawnAbility
  #######################
  - title: 'WBTI Spawn: BOATPOCALYPSE'
    description: Rain down Karves around the streamer!
    points: 300
    backgroundColor: '#c7915b'
    cooldown: 300
    type: SpawnAbility
    spawnAbilityData:
      accuracy: 1
      allowDrops: false
      announceMessage: 'Current weather forecast: 100% chance of BOATPOCALYPSE (sponsored by {{user}})'
      damage:
        blunt: 50
        basedOnMaxHealthAndArmor: true
        maxHealthPercentage: 0.4
      duration: 60
      groundOffset: 50
      maxToSpawn: 50
      minToSpawn: 50
      spawnRadius: 15
      spawns:
      - Karve
  - title: 'WBTI Spawn: Fizsh!'
    description: Spawn random fish around the streamer, what could this possible be used for?
    points: 300
    backgroundColor: '#cfdbab'
    cooldown: 180
    type: SpawnAbility
    spawnAbilityData:
      announceMessage: '{{user}} believes something is smelling.... fizshy!'
      duration: 1800
      groundOffset: 0
      maxToSpawn: 30
      minToSpawn: 30
      rescanForSafezones: false
      snapToterrain: true
      spawnDelay: 0
      spawnRadius: 25
  - title: 'WBTI Spawn: Log Rain'
    description: Give the streamer "senpai" some well deserved hard wood!
    points: 265
    backgroundColor: '#734624'
    cooldown: 300
    type: SpawnAbility
    spawnAbilityData:
      accuracy: 1
      announceMessage: '{{user}} is sending you some building materials: HARD WOOD!'
      damage:
        blunt: 50
        basedOnMaxHealthAndArmor: true
        maxHealthPercentage: 0.3
      dropVelocity: -25
      duration: 60
      groundOffset: 50
      isBiomeList: true
      maxToSpawn: 75
      minToSpawn: 75
      spawnRadius: 15
      spawns:
      - beech_log_half
      - PineTree_log_half
      - SwampTree1_log
      - FirTree_log_half
      - Birch_log_half
      - yggashoot_log_half
      - AshlandsTreeLogHalf2
      - Oak_log_half
  - title: 'WBTI Spawn: Thou shall be smited!'
    description: Bring pain to the streamer or make his screen shake violently!
    points: 300
    backgroundColor: '#b8d3e6'
    cooldown: 300
    type: SpawnAbility
    spawnAbilityData:
      accuracy: 1
      announceMessage: '{{user}} has summoned the wrath of Thor!'
      damage:
        lightning: 50
        basedOnMaxHealthAndArmor: true
        maxHealthPercentage: 0.3
      groundOffset: 0
      maxToSpawn: 50
      noSpawnEffect: true
      minToSpawn: 50
      snapToterrain: true
      spawnRadius: 20
      spawns:
      - lightningAOE
  - title: 'WBTI Spawn: Trap Field!'
    description: Spawn traps around the streamer!
    points: 300
    backgroundColor: '#1a3813'
    cooldown: 300
    type: SpawnAbility
    spawnAbilityData:
      announceMessage: Minor inconveniences deployed by {{user}}!
      damage:
        blunt: 50
        pierce: 50
        basedOnMaxHealthAndArmor: true
        maxHealthPercentage: 0.35
      duration: 300
      groundOffset: 0
      maxToSpawn: 300
      minToSpawn: 300
      rescanForSafezones: false
      snapToterrain: true
      spawnDelay: 0.0001
      spawnRadius: 25
      spawns:
      - fuling_trap
  #######################
  # SpawnCreature
  #######################
  - title: 'WBTI Creatures: HELP Fenrings!'
    description: Spawn a group of Fenring friends that will help the streamer!
    points: 255
    backgroundColor: '#74bd66'
    globalKeyAdd: defeated_bonemass
