# In this file you can add and configure your redeems for the WizshBone Twitch Integration
#
redeems:
  - type: SpawnCreature
    title: "WBTI Special creature!"
    points: 1000000000
    globalKeyAdd: defeated_fader
    backgroundColor: "#ff0000"
    creatureData:
      list:
        - prefabName: Neck
          level: 2
          friendly: true
          commandable: true
          size: 50
#######################################################
# Weather
#######################################################
  - type: SpawnWeather
    title: "WBTI Weather: Random"
    points: 10
    weatherData:
      announceMessage: "{{user}} is changing the skybox!"
      duration: 300
      force: false
      radius: 300
      height: 300
      items:
        - Clear
        - LightRain
        - Rain
        - Misty
        - ThunderStorm
        - nofogts
        - SwampRain
        #- Snow
        #- SnowStorm
        - Mistlands_clear
        - Mistlands_rain
        - Mistlands_thunder
        - Twilight_clear
        #- Twilight_Snow
        #- Twilight_SnowStorm
        - Eikthyr
        - GDKing
        - Bonemass
        #- Ghosts
        #- CavesHildir
